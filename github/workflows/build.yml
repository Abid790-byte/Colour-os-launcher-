name: Build Launcher APKon:push:branches: [main, master]workflow_dispatch:permissions:contents: writejobs:build:runs-on: ubuntu-lateststeps:- uses: actions/checkout@v4- uses: actions/setup-java@v4with:distribution: temurinjava-version: '17'- uses: android-actions/setup-android@v3- uses: gradle/actions/setup-gradle@v4with:gradle-version: '8.7'- name: Create project filesrun: |mkdir -p app/src/main/java/com/example/mylaunchermkdir -p app/src/main/res/valuescat > settings.gradle.kts <<'EOF'pluginManagement {repositories {google()mavenCentral()gradlePluginPortal()}}dependencyResolutionManagement {repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)repositories {google()mavenCentral()}}rootProject.name = "MyLauncher"include(":app")EOFcat > build.gradle.kts <<'EOF'plugins {id("com.android.application") version "8.5.2" apply falseid("org.jetbrains.kotlin.android") version "1.9.24" apply false}EOFcat > gradle.properties <<'EOF'android.useAndroidX=trueorg.gradle.jvmargs=-Xmx3gEOFcat > app/build.gradle.kts <<'EOF'plugins {id("com.android.application")id("org.jetbrains.kotlin.android")}android {namespace = "com.example.mylauncher"compileSdk = 34defaultConfig {applicationId = "com.example.mylauncher"minSdk = 26targetSdk = 34versionCode = 2versionName = "2.0"}compileOptions {sourceCompatibility = JavaVersion.VERSION_17targetCompatibility = JavaVersion.VERSION_17}kotlinOptions { jvmTarget = "17" }buildFeatures { compose = true }composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }}dependencies {implementation(platform("androidx.compose:compose-bom:2024.06.00"))implementation("androidx.compose.ui:ui")implementation("androidx.compose.foundation:foundation")implementation("androidx.compose.material3:material3")implementation("androidx.activity:activity-compose:1.9.0")implementation("androidx.core:core-ktx:1.13.1")}EOFcat > app/src/main/res/values/themes.xml <<'EOF'<?xml version="1.0" encoding="utf-8"?><resources><style name="Theme.MyLauncher" parent="android:Theme.Material.NoActionBar"><item name="android:windowShowWallpaper">true</item><item name="android:windowBackground">@android:color/transparent</item><item name="android:statusBarColor">@android:color/transparent</item><item name="android:navigationBarColor">@android:color/transparent</item></style></resources>EOFcat > app/src/main/AndroidManifest.xml <<'EOF'<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><queries><intent><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent></queries><applicationandroid:label="MyLauncher"android:theme="@style/Theme.MyLauncher"><activityandroid:name=".MainActivity"android:exported="true"android:launchMode="singleTask"android:stateNotNeeded="true"><intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.HOME" /><category android:name="android.intent.category.DEFAULT" /></intent-filter></activity></application></manifest>EOFcat > app/src/main/java/com/example/mylauncher/MainActivity.kt <<'EOF'package com.example.mylauncherimport android.content.Intentimport android.content.SharedPreferencesimport android.graphics.Bitmapimport android.graphics.drawable.AdaptiveIconDrawableimport android.graphics.drawable.Drawableimport android.os.Bundleimport androidx.activity.ComponentActivityimport androidx.activity.compose.setContentimport androidx.activity.enableEdgeToEdgeimport androidx.compose.animation.core.Springimport androidx.compose.animation.core.animateFloatAsStateimport androidx.compose.animation.core.springimport androidx.compose.foundation.ExperimentalFoundationApiimport androidx.compose.foundation.Imageimport androidx.compose.foundation.backgroundimport androidx.compose.foundation.borderimport androidx.compose.foundation.combinedClickableimport androidx.compose.foundation.interaction.MutableInteractionSourceimport androidx.compose.foundation.interaction.collectIsPressedAsStateimport androidx.compose.foundation.layout.Arrangementimport androidx.compose.foundation.layout.Boximport androidx.compose.foundation.layout.Columnimport androidx.compose.foundation.layout.ColumnScopeimport androidx.compose.foundation.layout.PaddingValuesimport androidx.compose.foundation.layout.Rowimport androidx.compose.foundation.layout.Spacerimport androidx.compose.foundation.layout.fillMaxSizeimport androidx.compose.foundation.layout.fillMaxWidthimport androidx.compose.foundation.layout.heightimport androidx.compose.foundation.layout.paddingimport androidx.compose.foundation.layout.sizeimport androidx.compose.foundation.layout.systemBarsPaddingimport androidx.compose.foundation.lazy.grid.GridCellsimport androidx.compose.foundation.lazy.grid.LazyVerticalGridimport androidx.compose.foundation.lazy.grid.itemsimport androidx.compose.foundation.shape.RoundedCornerShapeimport androidx.compose.foundation.text.BasicTextFieldimport androidx.compose.material3.Textimport androidx.compose.runtime.Composableimport androidx.compose.runtime.LaunchedEffectimport androidx.compose.runtime.getValueimport androidx.compose.runtime.mutableStateListOfimport androidx.compose.runtime.mutableStateOfimport androidx.compose.runtime.rememberimport androidx.compose.runtime.setValueimport androidx.compose.ui.Alignmentimport androidx.compose.ui.Modifierimport androidx.compose.ui.draw.clipimport androidx.compose.ui.draw.scaleimport androidx.compose.ui.geometry.Offsetimport androidx.compose.ui.graphics.Colorimport androidx.compose.ui.graphics.ImageBitmapimport androidx.compose.ui.graphics.Shadowimport androidx.compose.ui.graphics.SolidColorimport androidx.compose.ui.graphics.asImageBitmapimport androidx.compose.ui.text.TextStyleimport androidx.compose.ui.text.font.FontWeightimport androidx.compose.ui.text.style.TextAlignimport androidx.compose.ui.text.style.TextOverflowimport androidx.compose.ui.unit.Dpimport androidx.compose.ui.unit.dpimport androidx.compose.ui.unit.spimport androidx.core.graphics.drawable.toBitmapimport kotlinx.coroutines.delayimport java.time.LocalDateTimeimport java.time.format.DateTimeFormatterclass App(val label: String, val pkg: String, val drawable: Drawable)private val glass = Color.White.copy(alpha = 0.20f)private val glassBorder = Color.White.copy(alpha = 0.35f)private val shadowText = TextStyle(color = Color.White,shadow = Shadow(Color.Black.copy(alpha = 0.6f), Offset(0f, 2f), 6f))class MainActivity : ComponentActivity() {override fun onCreate(savedInstanceState: Bundle?) {super.onCreate(savedInstanceState)enableEdgeToEdge()val pm = packageManagerval apps = pm.queryIntentActivities(Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER), 0).map { App(it.loadLabel(pm).toString(), it.activityInfo.packageName, it.loadIcon(pm)) }.filter { it.pkg != packageName }.distinctBy { it.pkg }.sortedBy { it.label.lowercase() }val prefs = getSharedPreferences("launcher", MODE_PRIVATE)setContent {Launcher(apps, prefs) { pkg ->pm.getLaunchIntentForPackage(pkg)?.let { startActivity(it) }}}}}@Composablefun Launcher(apps: List<App>, prefs: SharedPreferences, launch: (String) -> Unit) {val dock = remember {val saved = prefs.getString("dock", null)val list = if (saved != null) {saved.split(",").filter { it.isNotEmpty() }} else {listOf("dialer", "messag", "chrome", "camera").mapNotNull { key -> apps.firstOrNull { it.pkg.contains(key) }?.pkg }}mutableStateListOf<String>().apply {addAll(list.filter { p -> apps.any { it.pkg == p } })}}var query by remember { mutableStateOf("") }fun toggleDock(pkg: String) {if (pkg in dock) dock.remove(pkg) else if (dock.size < 4) dock.add(pkg)prefs.edit().putString("dock", dock.joinToString(",")).apply()}val shown = apps.filter { it.label.contains(query, ignoreCase = true) }Column(Modifier.fillMaxSize().systemBarsPadding().padding(horizontal = 16.dp)) {Spacer(Modifier.height(24.dp))Clock(Modifier.align(Alignment.CenterHorizontally))Spacer(Modifier.height(20.dp))BasicTextField(value = query,onValueChange = { query = it },singleLine = true,textStyle = TextStyle(color = Color.White, fontSize = 16.sp),cursorBrush = SolidColor(Color.White),modifier = Modifier.fillMaxWidth(),decorationBox = { inner ->Box(Modifier.fillMaxWidth().clip(RoundedCornerShape(28.dp)).background(glass).border(1.dp, glassBorder, RoundedCornerShape(28.dp)).padding(horizontal = 20.dp, vertical = 14.dp)) {if (query.isEmpty()) {Text("Search apps", color = Color.White.copy(alpha = 0.7f),fontSize = 16.sp)}inner()}})LazyVerticalGrid(columns = GridCells.Fixed(4),modifier = Modifier.weight(1f),contentPadding = PaddingValues(vertical = 8.dp)) {items(shown, key = { it.pkg }) { app ->BouncyItem(onClick = { launch(app.pkg) },onLongClick = { toggleDock(app.pkg) },modifier = Modifier.padding(vertical = 10.dp)) {AppIcon(app, 58.dp)Spacer(Modifier.height(6.dp))Text(app.label,style = shadowText.copy(fontSize = 12.sp, textAlign = TextAlign.Center),maxLines = 1,overflow = TextOverflow.Ellipsis)}}}if (dock.isNotEmpty()) {Row(Modifier.align(Alignment.CenterHorizontally).padding(vertical = 12.dp).clip(RoundedCornerShape(36.dp)).background(glass).border(1.dp, glassBorder, RoundedCornerShape(36.dp)).padding(horizontal = 18.dp, vertical = 14.dp),horizontalArrangement = Arrangement.spacedBy(20.dp)) {dock.mapNotNull { p -> apps.firstOrNull { it.pkg == p } }.forEach{ app ->BouncyItem(onClick = { launch(app.pkg) },onLongClick = { toggleDock(app.pkg) }) {AppIcon(app, 58.dp)}}}}}}@Composablefun Clock(modifier: Modifier = Modifier) {var now by remember { mutableStateOf(LocalDateTime.now()) }LaunchedEffect(Unit) {while (true) {now = LocalDateTime.now()delay(5_000)}}Column(modifier, horizontalAlignment = Alignment.CenterHorizontally){Text(now.format(DateTimeFormatter.ofPattern("HH:mm")),style = shadowText.copy(fontSize = 72.sp, fontWeight = FontWeight.Light))Text(now.format(DateTimeFormatter.ofPattern("EEEE, d MMMM")),style = shadowText.copy(fontSize = 16.sp))}}@OptIn(ExperimentalFoundationApi::class)@Composablefun BouncyItem(onClick: () -> Unit,onLongClick: () -> Unit,modifier: Modifier = Modifier,content: @Composable ColumnScope.() -> Unit) {val source = remember { MutableInteractionSource() }val pressed by source.collectIsPressedAsState()val scale by animateFloatAsState(targetValue = if (pressed) 0.8f else 1f,animationSpec = spring(dampingRatio = Spring.DampingRatioMediumBouncy,stiffness = Spring.StiffnessMedium),label = "bounce")Column(modifier = modifier.scale(scale).combinedClickable(interactionSource = source,indication = null,onClick = onClick,onLongClick = onLongClick),horizontalAlignment = Alignment.CenterHorizontally,content = content)}@Composablefun AppIcon(app: App, size: Dp) {val image = remember(app.pkg) { toImage(app.drawable) }Image(bitmap = image,contentDescription = app.label,modifier = Modifier.size(size).clip(RoundedCornerShape(size * 0.28f)))}// Adaptive icons have a transparent margin; crop it so icons fill the rounded square.fun toImage(d: Drawable): ImageBitmap {val size = 192val bmp: Bitmap = d.toBitmap(size, size)if (d is AdaptiveIconDrawable) {val inset = size / 6return Bitmap.createBitmap(bmp, inset, inset, size - 2 * inset, size - 2* inset).asImageBitmap()}return bmp.asImageBitmap()}EOF- name: Build APKrun: gradle assembleDebug- name: Publish APK as a releaseuses: softprops/action-gh-release@v2with:tag_name: build-${{ github.run_number }}name: Build ${{ github.run_number }}files: app/build/outputs/apk/debug/app-debug.apk
